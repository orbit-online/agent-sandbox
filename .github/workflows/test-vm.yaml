# The NixOS VM test, the slowest by far: on anything that can change what runs in it. One job builds its parts in
# parallel (install-nix-action sets max-jobs = auto, 4 here): they share the VM system's build and the store's
# downloads, which a matrix job each would repeat
name: Test VM

on:
  push:
    branches: [main]
    paths:
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - nix/**
      - scripts/**
      - flake.nix
      - flake.lock
      - .github/workflows/test-vm.yaml
      - .github/actions/nix-cache-*/**
  pull_request:
    paths:
      - cmd/**
      - internal/**
      - go.mod
      - go.sum
      - nix/**
      - scripts/**
      - flake.nix
      - flake.lock
      - .github/workflows/test-vm.yaml
      - .github/actions/nix-cache-*/**

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Room for the store: the closure includes the real claude-desktop, mesa and the VM test
      - run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL
      # subid-broker's and the permissions broker's tests nest user namespaces inside the build. Ubuntu's AppArmor gives
      # a process in an unprivileged userns no capabilities, so the inner maps can't be written
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: cachix/install-nix-action@v31
        with:
          # The VM test needs kvm; listing it replaces the defaults, so they're repeated
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      # What earlier runs built themselves, cache.nixos.org has the rest
      - uses: ./.github/actions/nix-cache-restore
      # vm: vm-launch, vm-store, vm-work, vm-live and vm-loop
      - run: nix build -L .#checks.x86_64-linux.vm
      - uses: ./.github/actions/nix-cache-save
        if: ${{ !cancelled() }}
